media:
  input: media/cms-pilot
  output: /media/cms-pilot
  rename: safe
  categories:
    - image

content:
  - name: pilot_content
    label: Contenido de prueba (NO OFICIAL)
    type: collection
    path: content/cms-pilot
    filename: "{slug}.md"
    format: yaml-frontmatter
    subfolders: false
    view:
      primary: title
      fields:
        - title
        - status
        - updatedAt
      sort:
        - updatedAt
      default:
        sort: updatedAt
        order: desc
    operations:
      rename: false
    fields:
      - name: title
        label: Título de prueba
        type: string
        required: true
      - name: slug
        label: Identificador URL
        type: string
        required: true
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description: "Solo minúsculas, números y guiones; determina el nombre del archivo."
      - name: status
        label: Estado editorial
        type: select
        required: true
        options:
          values:
            - name: draft
              label: Borrador
            - name: in_review
              label: En revisión
            - name: published
              label: Publicado (solo etiqueta de prueba)
            - name: archived
              label: Archivado
      - name: summary
        label: Resumen de prueba
        type: text
      - name: body
        label: Texto de prueba
        type: rich-text
      - name: updatedAt
        label: Última actualización
        type: date
      - name: reviewNotes
        label: Notas internas de prueba
        type: text
  - name: boletines
    label: Boletines
    type: collection
    path: content/boletines
    filename: "{slug}.md"
    format: yaml-frontmatter
    fields:
      - { name: title, label: Título, type: text, required: true }
      - { name: slug, label: Slug, type: text, required: true }
      - { name: status, label: Estado, type: select, options: { values: [draft, in_review, published, archived] }, required: true }
      - { name: summary, label: Resumen, type: text }
      - { name: updatedAt, label: Actualizado, type: date }
      - { name: reviewNotes, label: Notas de revisión, type: text }
      - { name: editionDate, label: Fecha de edición, type: date, required: true }
      - { name: editionNumber, label: Número de edición, type: number, required: true }
      - { name: season, label: Tiempo litúrgico, type: text }
      - { name: attachmentUrl, label: Adjunto (PDF), type: text }
      - { name: body, label: Cuerpo (HTML), type: text }   # multilínea; vive en el cuerpo del .md
  - name: sermones
    label: Sermones
    type: collection
    path: content/sermones
    filename: "{slug}.md"
    format: yaml-frontmatter
    fields:
      - { name: title, label: Título, type: text, required: true }
      - { name: slug, label: Slug, type: text, required: true }
      - { name: status, label: Estado, type: select, options: { values: [draft, in_review, published, archived] }, required: true }
      - { name: summary, label: Resumen, type: text }
      - { name: updatedAt, label: Actualizado, type: date }
      - { name: reviewNotes, label: Notas de revisión, type: text }
      - { name: sermonDate, label: Fecha del sermón, type: date, required: true }
      - { name: topic, label: Tema, type: select, options: { values: [doctrina, libro-oracion] } }
      - { name: durationMinutes, label: Duración (min), type: number }
      - { name: preacher, label: Predicador, type: text }
      - { name: scriptureReference, label: Pasaje, type: text }
      - { name: audioUrl, label: Audio (URL), type: text }
      - { name: body, label: Cuerpo (HTML), type: text }   # multilínea; vive en el cuerpo del .md