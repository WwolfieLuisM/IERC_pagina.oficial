media:
  input: media/cms-pilot
  output: /media/cms-pilot
  rename: safe
  categories:
    - image

content:
  - name: pilot_content
    label: Contenido de prueba (NO OFICIAL)
    type: collection
    path: content/cms-pilot
    filename: "{slug}.md"
    format: yaml-frontmatter
    subfolders: false
    view:
      primary: title
      fields:
        - title
        - status
        - updatedAt
      sort:
        - updatedAt
      default:
        sort: updatedAt
        order: desc
    operations:
      rename: false
    fields:
      - name: title
        label: Título de prueba
        type: string
        required: true
      - name: slug
        label: Identificador URL
        type: string
        required: true
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description: "Solo minúsculas, números y guiones; determina el nombre del archivo."
      - name: status
        label: Estado editorial
        type: select
        required: true
        options:
          values:
            - name: draft
              label: Borrador
            - name: in_review
              label: En revisión
            - name: published
              label: Publicado (solo etiqueta de prueba)
            - name: archived
              label: Archivado
      - name: summary
        label: Resumen de prueba
        type: text
      - name: body
        label: Texto de prueba
        type: rich-text
      - name: updatedAt
        label: Última actualización
        type: date
      - name: reviewNotes
        label: Notas internas de prueba
        type: text